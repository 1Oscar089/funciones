# Compila el TypeScript con Vite y publica dist/ en GitHub Pages.
# Se dispara en cada push a main (y se puede lanzar a mano desde la pestana Actions).

name: Desplegar a GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Un despliegue a la vez: si empujas dos commits seguidos, cancela el anterior
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Compilar
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el codigo
        uses: actions/checkout@v4

      - name: Instalar Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Lint (ESLint)
        run: npm run lint

      - name: Build (typecheck + Vite)
        run: npm run build
        env:
          # Sustituyen a .env.local, que no existe en el servidor
          # --- Google Sheets (via Apps Script) ---
          VITE_SHEET_URL: ${{ secrets.VITE_SHEET_URL }}
          VITE_SHEET_TOKEN: ${{ secrets.VITE_SHEET_TOKEN }}
          # --- Firebase / Firestore ---
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}

      - name: Configurar Pages
        uses: actions/configure-pages@v5

      - name: Subir artefacto (dist/)
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: Publicar
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Desplegar a GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4